<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ali hakan ünal | non code</title>
    <link rel="stylesheet" href="css/non_code.css">
</head>
<body>
    <main id="non-code-page">
        <section class="non-code-intro">
            <p class="eyebrow">Human side</p>
            <h1>Hobbies</h1>
            <p>I have things to do except coding</p>
        </section>

        <section id="hobby-gallery" aria-label="Hobby gallery">
            <figure class="hobby-card hobby-guitar">
                <img src="assets/guitar.png" alt="Guitar">
                <figcaption>
                    <strong>Musician</strong>
                    <span>I have been playing and recording all kinds of music (jazz,classical,metal,folk) for 9 years.</span>
                </figcaption>
            </figure>

            <figure class="hobby-card hobby-hollow">
                <img src="assets/hollow_knight.webp" alt="Hollow Knight">
                <figcaption>
                    <strong>Game lover</strong>
                    <span>I love to play games time to time, lots of gems out there.</span>
                </figcaption>
            </figure>

            <figure class="hobby-card hobby-thing">
                <img src="assets/thing.jpg" alt="Hobby item">
                <figcaption>
                    <strong>Movies</strong>
                    <span>I would consider myself a cinephile, I am over 400 movies at letterbox.</span>
                </figcaption>
            </figure>

            <figure class="hobby-card hobby-spider">
                <img src="assets/spider_man.webp" alt="Spider-Man">
                <figcaption>
                    <strong>Comics</strong>
                    <span>Reading comics since I was a child, one hobby that I will never let go.</span>
                </figcaption>
            </figure>
            
            <figure class="hobby-card hobby-myth">
                <img src="assets/theseus.jpg" alt="Myth">
                <figcaption>
                    <strong>Mythology</strong>
                    <span>I have been fascinated by ancient mythology and iconography since childhood, and my interest has only grown stronger over the years.</span>
                </figcaption>
            </figure>

            <figure class="hobby-card hobby-book">
                <img src="assets/grapes.jpg" alt="Myth">
                <figcaption>
                    <strong>Books</strong>
                    <span>I love books and I am trying to read as much as I can. Again since I am a child I have gained this habit and my mind is profitting from it.</span>
                </figcaption>
            </figure>

        </section>
    </main>
</body>
</html>
